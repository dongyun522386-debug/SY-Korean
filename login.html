<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 · 한국어 단어장</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #0047A0; --primary-light: #1565C0;
    --accent:  #CD2E3A;
    --bg: #F4F8FF; --surface: #fff;
    --text: #1A2740; --text-muted: #5A6B8A;
    --border: #D0DCF0; --shadow: rgba(0,71,160,.12);
    --radius: 14px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px;
  }

  .brand {
    text-align: center;
    margin-bottom: 32px;
  }
  .brand-icon {
    width: 64px; height: 64px;
    background: var(--primary);
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
    margin: 0 auto 14px;
    box-shadow: 0 6px 20px rgba(0,71,160,.3);
  }
  .brand h1 { font-size: 1.4rem; font-weight: 700; color: var(--text); }
  .brand p  { font-size: 0.82rem; color: var(--text-muted); margin-top: 4px; }

  .card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: 0 8px 32px var(--shadow);
    padding: 36px 32px;
    width: 100%; max-width: 400px;
  }

  .tab-row {
    display: flex; gap: 0;
    background: var(--bg);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 28px;
  }
  .tab-row button {
    flex: 1; padding: 9px;
    border: none; background: transparent;
    border-radius: 8px;
    font-family: inherit; font-size: 0.9rem; font-weight: 500;
    color: var(--text-muted); cursor: pointer; transition: all .2s;
  }
  .tab-row button.active { background: var(--primary); color: #fff; }

  .form-group { margin-bottom: 18px; }
  label { display: block; font-size: 0.82rem; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; }
  input[type=text], input[type=email], input[type=password] {
    width: 100%; padding: 11px 14px;
    border: 1.5px solid var(--border); border-radius: 10px;
    font-family: inherit; font-size: 0.92rem; color: var(--text);
    background: var(--surface); outline: none; transition: border-color .2s;
  }
  input:focus { border-color: var(--primary); }

  .submit-btn {
    width: 100%; padding: 13px;
    background: var(--primary); color: #fff; border: none;
    border-radius: 10px; font-family: inherit; font-size: 0.95rem; font-weight: 600;
    cursor: pointer; transition: background .2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .submit-btn:hover:not(:disabled) { background: var(--primary-light); }
  .submit-btn:disabled { opacity: .65; cursor: not-allowed; }

  .error-msg {
    background: #FFF0F0; color: var(--accent);
    border: 1px solid #FFD0D0; border-radius: 8px;
    padding: 10px 14px; font-size: 0.84rem;
    margin-bottom: 16px; display: none;
  }
  .success-msg {
    background: #F0FFF4; color: #2E7D32;
    border: 1px solid #C8E6C9; border-radius: 8px;
    padding: 10px 14px; font-size: 0.84rem;
    margin-bottom: 16px; display: none;
  }
  .divider { text-align: center; color: var(--text-muted); font-size: 0.8rem; margin: 20px 0 16px; }

  .spinner { display: inline-block; width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,.4); border-top-color: #fff;
    border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="brand">
  <div class="brand-icon">🇰🇷</div>
  <h1>한국어 단어장</h1>
  <p>中文学习者向 韩国语词汇应用</p>
</div>

<div class="card">
  <div class="tab-row">
    <button class="active" id="tabLogin"  onclick="switchTab('login')">로그인</button>
    <button           id="tabSignup" onclick="switchTab('signup')">회원가입</button>
  </div>

  <div id="errorMsg"   class="error-msg"></div>
  <div id="successMsg" class="success-msg"></div>

  <!-- Login form -->
  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label>이메일 · Email</label>
      <input type="email" id="loginEmail" placeholder="example@email.com" required autocomplete="email">
    </div>
    <div class="form-group">
      <label>비밀번호 · Password</label>
      <input type="password" id="loginPw" placeholder="비밀번호 입력" required autocomplete="current-password">
    </div>
    <button type="submit" class="submit-btn" id="loginBtn">로그인</button>
  </form>

  <!-- Signup form (hidden initially) -->
  <form id="signupForm" style="display:none" onsubmit="handleSignup(event)">
    <div class="form-group">
      <label>이름 · 姓名</label>
      <input type="text" id="signupName" placeholder="표시될 이름" required>
    </div>
    <div class="form-group">
      <label>이메일 · Email</label>
      <input type="email" id="signupEmail" placeholder="example@email.com" required autocomplete="email">
    </div>
    <div class="form-group">
      <label>비밀번호 · Password (6자 이상)</label>
      <input type="password" id="signupPw" placeholder="비밀번호 입력" required minlength="6" autocomplete="new-password">
    </div>
    <button type="submit" class="submit-btn" id="signupBtn">회원가입</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script>
  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

  // Already logged in → go to app
  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (session) window.location.href = 'index.html';
  })();

  function switchTab(tab) {
    const isLogin = tab === 'login';
    document.getElementById('tabLogin').classList.toggle('active', isLogin);
    document.getElementById('tabSignup').classList.toggle('active', !isLogin);
    document.getElementById('loginForm').style.display  = isLogin ? '' : 'none';
    document.getElementById('signupForm').style.display = isLogin ? 'none' : '';
    hideMessages();
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg; el.style.display = 'block';
    document.getElementById('successMsg').style.display = 'none';
  }
  function showSuccess(msg) {
    const el = document.getElementById('successMsg');
    el.textContent = msg; el.style.display = 'block';
    document.getElementById('errorMsg').style.display = 'none';
  }
  function hideMessages() {
    document.getElementById('errorMsg').style.display = 'none';
    document.getElementById('successMsg').style.display = 'none';
  }
  function setLoading(btnId, loading) {
    const btn = document.getElementById(btnId);
    btn.disabled = loading;
    btn.innerHTML = loading
      ? '<span class="spinner"></span> 처리 중...'
      : (btnId === 'loginBtn' ? '로그인' : '회원가입');
  }

  async function handleLogin(e) {
    e.preventDefault();
    hideMessages();
    setLoading('loginBtn', true);
    const email    = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPw').value;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { showError(error.message); setLoading('loginBtn', false); return; }
    window.location.href = 'index.html';
  }

  async function handleSignup(e) {
    e.preventDefault();
    hideMessages();
    setLoading('signupBtn', true);
    const name     = document.getElementById('signupName').value.trim();
    const email    = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPw').value;
    const { error } = await sb.auth.signUp({
      email, password,
      options: { data: { display_name: name } }
    });
    setLoading('signupBtn', false);
    if (error) { showError(error.message); return; }
    showSuccess('가입 완료! 이메일 확인 후 로그인하세요. · 注册成功，请验证邮箱后登录。');
  }
</script>
</body>
</html>
